# Changelog fragments: add changelog.d/<issue>.<type>.md in each pull request (see changelog.d/README.md).
# At release time `towncrier build --version X.Y.Z` collects them into CHANGELOG.md and deletes them.
[tool.towncrier]
name = "speech-transcription-toolkit"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}](https://github.com/MysterionRise/speech-transcription-toolkit/releases/tag/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/MysterionRise/speech-transcription-toolkit/issues/{issue})"
underlines = ["", "", ""]
ignore = ["README.md"]

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
