[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-transcription-toolkit"
dynamic = ["version"]
description = "Offline speech-to-text: Whisper, faster-whisper or Voxtral, optional speaker diarization, TXT/SRT/VTT/JSON output."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konstantin Perikov" }]
keywords = ["speech-to-text", "transcription", "whisper", "faster-whisper", "voxtral", "diarization", "subtitles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
# Whisper is the default backend, so a plain install transcribes out of the box. Also needs ffmpeg on PATH.
dependencies = [
    "openai-whisper>=20250625",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.2; python_version >= '3.13'",  # pydub needs it since audioop left the stdlib
]

[project.optional-dependencies]
faster-whisper = [
    "faster-whisper>=1.2.1",
    # faster-whisper 1.2.1 still passes av.open(metadata_errors=...), which PyAV 19 removed
    # (SYSTRAN/faster-whisper#1492); drop this cap once a faster-whisper release supports PyAV 19.
    "av>=18.1.0,<19",
]
voxtral = ["transformers>=5.17.0", "mistral-common[audio]>=1.12.0"]
# Speaker labels: also needs a Hugging Face token and the terms of
# https://hf.co/pyannote/speaker-diarization-community-1 accepted.
diarize = ["pyannote.audio>=4.0.7"]
all = ["speech-transcription-toolkit[faster-whisper,voxtral,diarize]"]

[project.scripts]
transcribe = "speech_toolkit.cli:main"
ogg2wav = "speech_toolkit.convert:main"

[project.urls]
Homepage = "https://github.com/MysterionRise/speech-transcription-toolkit"
Issues = "https://github.com/MysterionRise/speech-transcription-toolkit/issues"

[tool.setuptools.dynamic]
version = { attr = "speech_toolkit.__version__" }

# Only the package ships; tests/ and the main.py/convert.py checkout shims stay out.
[tool.setuptools.packages.find]
include = ["speech_toolkit*"]

[tool.setuptools.package-data]
speech_toolkit = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "htmlcov",
    "build",
    "dist",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_optional = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov",
    "--cov-report=term-missing",
    "--cov-branch",
]

[tool.coverage.run]
source = ["speech_toolkit"]
omit = [
    "speech_toolkit/__main__.py",  # exercised in a subprocess by the tests
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    ".git",
]
skips = ["B101", "B601", "B615"]  # B101: assert_used, B601: shell_injection (intentional), B615: huggingface revision (users want latest models)
