# Monthly dependency updates, grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Only touch a requirement when the new release falls outside its range: bumps the
    # pinned dev tools but leaves runtime minimums (e.g. transformers>=...) alone.
    versioning-strategy: increase-if-necessary
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
