# The documentation site (mkdocs.yml): built on pull requests that change it, and published to GitHub Pages from main.
#
# - Pull requests: `mkdocs build --strict`, which fails on any warning: a broken link or anchor, a page missing from
#   the nav, a docstring the API reference can't read, an example that docs/examples.md can't find.
# - main (and Run workflow on main): the same build, then the deploy to GitHub Pages.
#
# One-time setup (#13): Settings -> Pages -> Source: "GitHub Actions". Until then the deploy job fails on main, with a
# message saying so; it never runs on pull requests, so their checks don't depend on Pages. After enabling Pages, Run
# workflow publishes the site without waiting for the next docs change.
#
# Actions are pinned to commits, as in release.yml (Dependabot updates them), since the deploy job can publish.
name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'speech_toolkit/**'  # the API reference comes from the docstrings
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'speech_toolkit/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}  # each job asks for what it needs

# A new push to a pull request cancels its previous build. Deploys from main queue up instead, and only the newest
# waiting one runs, so an older site never replaces a newer one.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-docs.txt

    # Only the docs tools: the API reference reads the source without importing it, so no torch or fastapi.
    - name: Install MkDocs
      run: pip install -r requirements-docs.txt

    - name: Build the site (any warning fails)
      run: mkdocs build --strict

    - name: Upload the site for GitHub Pages
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write  # to deploy
      id-token: write  # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - name: Deploy
      id: deploy
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

    - name: Explain a failed deploy
      if: failure()
      run: |
        message="The docs site built, but publishing it failed. If GitHub Pages isn't enabled yet, enable it: Settings -> Pages -> Source: GitHub Actions (see #13), then re-run this workflow. Pull requests don't run this job, so this blocks nothing."
        echo "::error title=GitHub Pages deploy failed::$message"
        echo "### GitHub Pages deploy failed" >> "$GITHUB_STEP_SUMMARY"
        echo "$message" >> "$GITHUB_STEP_SUMMARY"
