name: CI/CD Pipeline

# One run per change: pushes to a PR branch run through the pull_request event only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

# A new push to a PR cancels the PR's previous run. Every other run (main, manual, called by another workflow) gets
# a group of its own, so it is never cancelled, and a run on main never waits for or replaces another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run black (code formatting check)
      run: black --check .

    - name: Run isort (import sorting check)
      run: isort --check-only --profile black .

    - name: Run flake8 (style and complexity)
      run: flake8 . --count --statistics

    - name: Build the package and check its metadata
      run: |
        python -m build
        twine check --strict dist/*

    # --no-deps: the commands must start without the model libraries (they import them lazily).
    - name: Smoke-test the installed wheel
      run: |
        pip install --no-deps dist/*.whl
        cd "$RUNNER_TEMP"
        transcribe --version
        transcribe --list-backends
        ogg2wav --help

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run bandit (security linter)
      run: bandit -c pyproject.toml -r .

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    # Unit tests mock whisper/torch/transformers, so no model libraries are installed here.
    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with pytest (95% coverage gate)
      run: pytest --cov-fail-under=95

  # Unit tests on macOS and Windows, for path, encoding and line-ending bugs. Not meant to be required checks,
  # so Integration Tests doesn't wait for them.
  test-os:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with pytest (95% coverage gate)
      run: pytest --cov-fail-under=95

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run mypy (static type checking)
      run: mypy speech_toolkit

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    # Skipped on draft PRs (marking the PR ready runs it); runs on main, ready PRs, manual and called runs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    env:
      # pyannote's diarization model is gated: the diarization test runs once the HF_TOKEN secret exists (#13).
      HAS_HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.txt

    # A stalled apt mirror can otherwise hold this step until the job times out: each try gets 3 minutes, 3 tries.
    - name: Install system dependencies
      timeout-minutes: 10
      run: |
        apt_get() {
          sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"
        }
        for attempt in 1 2 3; do
          if apt_get update && apt_get install -y ffmpeg; then exit 0; fi
          echo "::warning::Installing ffmpeg failed or timed out (attempt $attempt of 3)"
          sleep 15
        done
        exit 1

    - name: Install the package (CPU-only torch)
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements-dev.txt ".[faster-whisper,nvidia,server]" openai

    - name: Install speaker diarization
      if: env.HAS_HF_TOKEN == 'true'
      run: |
        pip install torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install ".[diarize]"

    # Model weights (several GB) come from the cache that runs on main save. The key changes with the files that name
    # the models (this workflow and the integration tests); the newest older cache is restored then, so only new
    # models download.
    - name: Restore cached models
      id: models
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/huggingface/hub
          ~/.cache/whisper
        key: models-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'tests/integration/**') }}
        restore-keys: models-${{ runner.os }}-

    # tests/integration: real models transcribe the samples in tests/data. Here a missing package fails its tests
    # instead of skipping them, and -rA prints each transcript with its word error rate.
    - name: Run the integration tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        INTEGRATION_REQUIRE_EXTRAS: '1'
      run: pytest -m integration --no-cov -rA --basetemp="$RUNNER_TEMP/integration"

    # Only main saves (PRs restore main's cache), and also after a failed step: what was downloaded is kept.
    - name: Save the model cache
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.models.outcome == 'success' && steps.models.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/huggingface/hub
          ~/.cache/whisper
        key: ${{ steps.models.outputs.cache-primary-key }}

    # Every test's files (transcripts, subtitles, JSON, the server's log), one folder per test.
    - name: Upload test outputs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: integration-test-outputs
        path: ${{ runner.temp }}/integration
