name: CI/CD Pipeline

# One run per change: pushes to a PR branch run through the pull_request event only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

# A new push to a PR cancels the PR's previous run. Every other run (main, manual, called by another workflow) gets
# a group of its own, so it is never cancelled, and a run on main never waits for or replaces another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run black (code formatting check)
      run: black --check .

    - name: Run isort (import sorting check)
      run: isort --check-only --profile black .

    - name: Run flake8 (style and complexity)
      run: flake8 . --count --statistics

    - name: Build the package and check its metadata
      run: |
        python -m build
        twine check --strict dist/*

    # --no-deps: the commands must start without the model libraries (they import them lazily).
    - name: Smoke-test the installed wheel
      run: |
        pip install --no-deps dist/*.whl
        cd "$RUNNER_TEMP"
        transcribe --version
        transcribe --list-backends
        ogg2wav --help

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run bandit (security linter)
      run: bandit -c pyproject.toml -r .

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    # Unit tests mock whisper/torch/transformers, so no model libraries are installed here.
    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with pytest (95% coverage gate)
      run: pytest --cov-fail-under=95

  # Unit tests on macOS and Windows, for path, encoding and line-ending bugs. Not meant to be required checks,
  # so Integration Tests doesn't wait for them.
  test-os:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with pytest (95% coverage gate)
      run: pytest --cov-fail-under=95

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run mypy (static type checking)
      run: mypy speech_toolkit

  # What a plain `pip install .` gives users: no PyTorch, and transcription with the default backend, faster-whisper.
  # On the oldest and the newest Python, where wheels of faster-whisper's dependencies are most likely to be missing.
  core-install:
    name: Core Install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install the package without extras
      run: pip install .

    - name: Check that no PyTorch, openai-whisper or pydub was installed
      run: |
        pip list
        if pip list | grep -iE '^(torch|torchaudio|openai-whisper|transformers|pydub|audioop-lts) '; then
          echo "::error::A plain install pulled in the packages listed above."
          exit 1
        fi

    # Run outside the checkout, so the installed package is listed. faster-whisper must be the default and installed.
    - name: List the backends
      working-directory: ${{ runner.temp }}
      run: |
        transcribe --list-backends | tee backends.txt
        grep -A 4 '^  faster-whisper (default)$' backends.txt | grep 'Installed: yes'

    # tests/integration/test_core_install.py transcribes a sample with the default backend, using only the packages
    # installed above (plus pytest).
    - name: Transcribe with the default backend
      run: |
        pip install $(grep -E '^pytest(-cov)?==' requirements-dev.txt)
        pytest -m integration tests/integration/test_core_install.py --no-cov -rA

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    # Skipped on draft PRs (marking the PR ready runs it); runs on main, ready PRs, manual and called runs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    env:
      # pyannote's diarization model is gated: the diarization test runs once the HF_TOKEN secret exists (#13).
      HAS_HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.txt

    # ffmpeg from PyPI, not apt, whose mirrors stalled this step for 8 to 30 minutes: imageio-ffmpeg ships a static
    # build (ffmpeg 7.0, with Opus and Vorbis), installed in a folder of its own so the test environment doesn't see
    # it. It has no ffprobe, which nothing here uses. nightly.yml installs the newest release the same way.
    - name: Install ffmpeg
      timeout-minutes: 10
      run: |
        pip install --target "$RUNNER_TEMP/imageio-ffmpeg" imageio-ffmpeg==0.6.0
        exe=$(PYTHONPATH="$RUNNER_TEMP/imageio-ffmpeg" python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
        mkdir -p "$RUNNER_TEMP/bin"
        ln -s "$exe" "$RUNNER_TEMP/bin/ffmpeg"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/ffmpeg" -hide_banner -version

    - name: Install the package (CPU-only torch)
      id: install
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements-dev.txt ".[whisper,nvidia,server]" openai

    - name: Install speaker diarization
      if: env.HAS_HF_TOKEN == 'true'
      run: |
        pip install torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install ".[diarize]"

    # Model weights (several GB) come from the cache that runs on main save. The key changes with the files that name
    # the models (this workflow and the integration tests); the newest older cache is restored then, so only new
    # models download.
    - name: Restore cached models
      id: models
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/huggingface/hub
          ~/.cache/whisper
        key: models-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'tests/integration/**') }}
        restore-keys: models-${{ runner.os }}-

    # tests/integration: real models transcribe the samples in tests/data. Here a missing package fails its tests
    # instead of skipping them, and -rA prints each transcript with its word error rate.
    - name: Run the integration tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        INTEGRATION_REQUIRE_EXTRAS: '1'
      run: pytest -m integration --no-cov -rA --basetemp="$RUNNER_TEMP/integration"

    # The unit tests that need the real ffmpeg (they skip where there is none, as in the unit test jobs). They run even
    # when an integration test failed.
    - name: Run the ffmpeg tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: pytest tests/test_convert.py -k TestWithFfmpeg --no-cov -rA

    # Only main saves (PRs restore main's cache), and also after a failed step: what was downloaded is kept.
    - name: Save the model cache
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.models.outcome == 'success' && steps.models.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/huggingface/hub
          ~/.cache/whisper
        key: ${{ steps.models.outputs.cache-primary-key }}

    # Every test's files (transcripts, subtitles, JSON, the server's log), one folder per test.
    - name: Upload test outputs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: integration-test-outputs
        path: ${{ runner.temp }}/integration
