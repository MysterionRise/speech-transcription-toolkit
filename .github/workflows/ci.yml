name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run black (code formatting check)
      run: black --check .

    - name: Run isort (import sorting check)
      run: isort --check-only --profile black .

    - name: Run flake8 (style and complexity)
      run: flake8 . --count --statistics

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run bandit (security linter)
      run: bandit -c pyproject.toml -r .

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    # Unit tests mock whisper/torch/transformers, so no model libraries are installed here.
    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with pytest (80% coverage gate)
      run: pytest

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run mypy (static type checking)
      run: mypy main.py convert.py formats.py media.py backends/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-faster-whisper.txt

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies (CPU-only torch)
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt -r requirements-faster-whisper.txt

    - name: Create speech samples
      run: |
        # Synthesized speech (ffmpeg's flite source), so the test checks real words.
        ffmpeg -loglevel error -f lavfi -i "flite=text='Hello world. This is a speech recognition test.':voice=slt" -ar 16000 speech.wav
        mkdir batch
        cp speech.wav batch/one.wav
        cp speech.wav batch/two.wav

    - name: Whisper transcript on stdout
      run: |
        python main.py speech.wav -m tiny > out.txt
        cat out.txt
        grep -qiE "hello|world" out.txt
        # stdout must carry only the transcript (progress goes to stderr)
        test "$(wc -l < out.txt)" -eq 1

    - name: Subtitles and JSON output
      run: |
        python main.py speech.wav -m tiny -q -o out.srt --json out.json
        cat out.srt
        grep -q -- "-->" out.srt
        python -c "import json; assert json.load(open('out.json'))['segments']"

    - name: Batch mode
      run: |
        python main.py batch -m tiny -q --outdir subs -f vtt
        head -n 5 subs/one.vtt subs/two.vtt
        grep -q "WEBVTT" subs/one.vtt

    - name: faster-whisper backend
      run: |
        python main.py speech.wav -b faster-whisper -m tiny -q > fw.txt
        cat fw.txt
        grep -qiE "hello|world" fw.txt

    - name: Upload test outputs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: integration-test-outputs
        path: |
          out.txt
          out.srt
          out.json
          subs/
          fw.txt
