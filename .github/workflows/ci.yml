name: CI/CD Pipeline

# One run per change: pushes to a PR branch run through the pull_request event only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

# A new push to a PR cancels the PR's previous run. Every other run (main, manual, called by another workflow) gets
# a group of its own, so it is never cancelled, and a run on main never waits for or replaces another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run black (code formatting check)
      run: black --check .

    - name: Run isort (import sorting check)
      run: isort --check-only --profile black .

    - name: Run flake8 (style and complexity)
      run: flake8 . --count --statistics

    - name: Build the package and check its metadata
      run: |
        python -m build
        twine check --strict dist/*

    # --no-deps: the commands must start without the model libraries (they import them lazily).
    - name: Smoke-test the installed wheel
      run: |
        pip install --no-deps dist/*.whl
        cd "$RUNNER_TEMP"
        transcribe --version
        transcribe --list-backends
        ogg2wav --help

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run bandit (security linter)
      run: bandit -c pyproject.toml -r .

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    # Unit tests mock whisper/torch/transformers, so no model libraries are installed here.
    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with pytest (95% coverage gate)
      run: pytest --cov-fail-under=95

  # Unit tests on macOS and Windows, for path, encoding and line-ending bugs. Not meant to be required checks,
  # so Integration Tests doesn't wait for them.
  test-os:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with pytest (95% coverage gate)
      run: pytest --cov-fail-under=95

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run mypy (static type checking)
      run: mypy speech_toolkit

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    # Skipped on draft PRs (marking the PR ready runs it); runs on main, ready PRs, manual and called runs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install the package (CPU-only torch)
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install ".[faster-whisper,nvidia,server]" openai

    # Model weights (several GB) come from the cache that runs on main save. The key changes with this file, which
    # names the models; the newest older cache is restored then, so only new models download.
    - name: Restore cached models
      id: models
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/huggingface/hub
          ~/.cache/whisper
        key: models-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
        restore-keys: models-${{ runner.os }}-

    - name: Create speech samples
      run: |
        # Synthesized speech (ffmpeg's flite source), so the test checks real words.
        ffmpeg -loglevel error -f lavfi -i "flite=text='Hello world. This is a speech recognition test.':voice=slt" -ar 16000 speech.wav
        mkdir batch
        cp speech.wav batch/one.wav
        cp speech.wav batch/two.wav

    - name: Whisper transcript on stdout
      run: |
        transcribe speech.wav -m tiny > out.txt
        cat out.txt
        grep -qiE "hello|world" out.txt
        # stdout must carry only the transcript (progress goes to stderr)
        test "$(wc -l < out.txt)" -eq 1

    - name: Subtitles and JSON output
      run: |
        transcribe speech.wav -m tiny -q -o out.srt --json out.json
        cat out.srt
        grep -q -- "-->" out.srt
        python -c "import json; assert json.load(open('out.json'))['segments']"

    - name: Batch mode
      run: |
        transcribe batch -m tiny -q --outdir subs -f vtt
        head -n 5 subs/one.vtt subs/two.vtt
        grep -q "WEBVTT" subs/one.vtt

    - name: faster-whisper backend
      run: |
        transcribe speech.wav -b faster-whisper -m tiny -q > fw.txt
        cat fw.txt
        grep -qiE "hello|world" fw.txt

    - name: Accuracy options and subtitle lines
      run: |
        transcribe speech.wav -b faster-whisper -m tiny -q --vad --prompt "Speech recognition." --max-line-width 20 -o lines.srt
        cat lines.srt
        test "$(grep -c -- '-->' lines.srt)" -ge 2  # 47 characters at 20 per line, 2 lines per cue

    - name: Parakeet backend
      run: |
        transcribe speech.wav -b parakeet -q --word-timestamps -o parakeet.json
        python -c "import json; d = json.load(open('parakeet.json')); print(d['text']); assert d['segments'][0]['words']"
        grep -qiE "hello|world" parakeet.json

    - name: Canary backend
      run: |
        transcribe speech.wav -b canary -l en -q > canary.txt
        cat canary.txt
        grep -qiE "hello|world" canary.txt

    - name: Python API
      run: |
        cd "$RUNNER_TEMP"  # import the installed package, not the checkout
        python - <<'EOF'
        import os
        from speech_toolkit import Transcriber

        transcriber = Transcriber("faster-whisper", "tiny")
        result = transcriber.transcribe(os.path.join(os.environ["GITHUB_WORKSPACE"], "speech.wav"))
        print(result.text)
        assert "hello" in result.text.lower() or "world" in result.text.lower()
        result.save(os.path.join(os.environ["GITHUB_WORKSPACE"], "api.vtt"))
        EOF
        head -n 4 "$GITHUB_WORKSPACE/api.vtt"

    - name: OpenAI-compatible server
      run: |
        transcribe-server -b faster-whisper -m tiny --port 8765 > server.log 2>&1 &
        SERVER_PID=$!
        for _ in $(seq 60); do curl -sf http://127.0.0.1:8765/health && break; sleep 2; done
        curl -sf http://127.0.0.1:8765/health || { cat server.log; exit 1; }
        python - <<'EOF'
        from openai import OpenAI

        client = OpenAI(base_url="http://127.0.0.1:8765/v1", api_key="unused")

        def transcribe(**options):
            with open("speech.wav", "rb") as audio:
                return client.audio.transcriptions.create(model="whisper-1", file=audio, **options)

        text = transcribe().text
        print(text)
        assert "hello" in text.lower() or "world" in text.lower()
        srt = transcribe(response_format="srt")
        print(srt)
        assert "-->" in srt
        verbose = transcribe(response_format="verbose_json", timestamp_granularities=["word"])
        print([w.word for w in verbose.words])
        assert verbose.words and verbose.segments
        EOF
        kill "$SERVER_PID"

    # Only main saves (PRs restore main's cache), and also after a failed step: what was downloaded is kept.
    - name: Save the model cache
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.models.outcome == 'success' && steps.models.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/huggingface/hub
          ~/.cache/whisper
        key: ${{ steps.models.outputs.cache-primary-key }}

    - name: Upload test outputs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: integration-test-outputs
        path: |
          out.txt
          out.srt
          out.json
          subs/
          fw.txt
          lines.srt
          parakeet.json
          canary.txt
          api.vtt
          server.log
