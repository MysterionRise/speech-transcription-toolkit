name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run black (code formatting check)
      run: black --check .

    - name: Run isort (import sorting check)
      run: isort --check-only --profile black .

    - name: Run flake8 (style and complexity)
      run: flake8 . --count --statistics

    - name: Build the package and check its metadata
      run: |
        python -m build
        twine check --strict dist/*

    # --no-deps: the commands must start without the model libraries (they import them lazily).
    - name: Smoke-test the installed wheel
      run: |
        pip install --no-deps dist/*.whl
        cd "$RUNNER_TEMP"
        transcribe --version
        transcribe --list-backends
        ogg2wav --help

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run bandit (security linter)
      run: bandit -c pyproject.toml -r .

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    # Unit tests mock whisper/torch/transformers, so no model libraries are installed here.
    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with pytest (80% coverage gate)
      run: pytest

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev tools
      run: pip install -r requirements-dev.txt

    - name: Run mypy (static type checking)
      run: mypy speech_toolkit

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install the package (CPU-only torch)
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install ".[faster-whisper]"

    - name: Create speech samples
      run: |
        # Synthesized speech (ffmpeg's flite source), so the test checks real words.
        ffmpeg -loglevel error -f lavfi -i "flite=text='Hello world. This is a speech recognition test.':voice=slt" -ar 16000 speech.wav
        mkdir batch
        cp speech.wav batch/one.wav
        cp speech.wav batch/two.wav

    - name: Whisper transcript on stdout
      run: |
        transcribe speech.wav -m tiny > out.txt
        cat out.txt
        grep -qiE "hello|world" out.txt
        # stdout must carry only the transcript (progress goes to stderr)
        test "$(wc -l < out.txt)" -eq 1

    - name: Subtitles and JSON output
      run: |
        transcribe speech.wav -m tiny -q -o out.srt --json out.json
        cat out.srt
        grep -q -- "-->" out.srt
        python -c "import json; assert json.load(open('out.json'))['segments']"

    - name: Batch mode
      run: |
        transcribe batch -m tiny -q --outdir subs -f vtt
        head -n 5 subs/one.vtt subs/two.vtt
        grep -q "WEBVTT" subs/one.vtt

    - name: faster-whisper backend
      run: |
        transcribe speech.wav -b faster-whisper -m tiny -q > fw.txt
        cat fw.txt
        grep -qiE "hello|world" fw.txt

    - name: Accuracy options and subtitle lines
      run: |
        transcribe speech.wav -b faster-whisper -m tiny -q --vad --prompt "Speech recognition." --max-line-width 20 -o lines.srt
        cat lines.srt
        test "$(grep -c -- '-->' lines.srt)" -ge 2  # 47 characters at 20 per line, 2 lines per cue

    - name: Python API
      run: |
        cd "$RUNNER_TEMP"  # import the installed package, not the checkout
        python - <<'EOF'
        import os
        from speech_toolkit import Transcriber

        transcriber = Transcriber("faster-whisper", "tiny")
        result = transcriber.transcribe(os.path.join(os.environ["GITHUB_WORKSPACE"], "speech.wav"))
        print(result.text)
        assert "hello" in result.text.lower() or "world" in result.text.lower()
        result.save(os.path.join(os.environ["GITHUB_WORKSPACE"], "api.vtt"))
        EOF
        head -n 4 "$GITHUB_WORKSPACE/api.vtt"

    - name: Upload test outputs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: integration-test-outputs
        path: |
          out.txt
          out.srt
          out.json
          subs/
          fw.txt
          lines.srt
          api.vtt
